<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Sushi | Restaurant</title>

    <link rel="stylesheet" href="style.css">

    <script
        type="module"
        src="/node_modules/@google/model-viewer/dist/model-viewer.min.js">
    </script>
</head>

<body>

    <main class="menu-page">

        <header class="restaurant-header">
            <span class="restaurant-name">SAKURA</span>
            <span class="menu-label">MENU</span>
        </header>

        <section class="dish-info">

            <div class="dish-text">
                <p class="category"></p>

<h1></h1>

<p class="description"></p>

<div class="price"></div>
            </div>

            <div class="viewer-container">

                <model-viewer
                    alt=""
                    camera-controls
                    auto-rotate
                    shadow-intensity="1"
                    exposure="1"
                    environment-image="neutral"
                    ar
                    ar-modes="webxr scene-viewer quick-look">

                    <button slot="ar-button" class="ar-button">
                        📱 View in AR
                    </button>

                    <a class="whatsapp-ar-button whatsapp-order-button" href="#" target="_blank"
                       rel="noopener noreferrer" aria-label="Order now on WhatsApp" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2a9.7 9.7 0 0 0-8.3 14.7L2.5 22l5.5-1.2A10 10 0 1 0 12 2Zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.3.7.7-3.2-.2-.3A8 8 0 1 1 12 19.8Zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8.9-.3.2-.5.1a6.5 6.5 0 0 1-1.9-1.2 7.2 7.2 0 0 1-1.3-1.6c-.1-.2 0-.3.1-.4l.4-.5.2-.4v-.4c0-.1-.5-1.3-.7-1.8-.2-.4-.4-.4-.5-.4h-.4c-.2 0-.4.1-.6.3a2.5 2.5 0 0 0-.8 1.8 4.3 4.3 0 0 0 .9 2.3 9.8 9.8 0 0 0 3.8 3.4c.5.2.9.4 1.2.5.5.1.9.1 1.3.1.4-.1 1.4-.6 1.6-1.1s.2-1 .2-1.1-.2-.2-.4-.3Z"/>
                        </svg>
                        <span>Order Now</span>
                    </a>

                </model-viewer>

                <a class="whatsapp-fallback-button whatsapp-order-button" href="#"
                   target="_blank" rel="noopener noreferrer" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2a9.7 9.7 0 0 0-8.3 14.7L2.5 22l5.5-1.2A10 10 0 1 0 12 2Zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.3.7.7-3.2-.2-.3A8 8 0 1 1 12 19.8Zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8.9-.3.2-.5.1a6.5 6.5 0 0 1-1.9-1.2 7.2 7.2 0 0 1-1.3-1.6c-.1-.2 0-.3.1-.4l.4-.5.2-.4v-.4c0-.1-.5-1.3-.7-1.8-.2-.4-.4-.4-.5-.4h-.4c-.2 0-.4.1-.6.3a2.5 2.5 0 0 0-.8 1.8 4.3 4.3 0 0 0 .9 2.3 9.8 9.8 0 0 0 3.8 3.4c.5.2.9.4 1.2.5.5.1.9.1 1.3.1.4-.1 1.4-.6 1.6-1.1s.2-1 .2-1.1-.2-.2-.4-.3Z"/>
                    </svg>
                    <span>Order Now</span>
                </a>

                <p class="viewer-message" aria-live="polite"></p>

                <p class="viewer-hint">
                    👆 Drag to rotate · 🤏 Pinch to zoom
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
